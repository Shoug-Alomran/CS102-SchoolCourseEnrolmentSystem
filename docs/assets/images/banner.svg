<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <title>School Course Enrolment System - CS102 Java Project</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a5eb5"/>
      <stop offset="0.5" stop-color="#0c76ba"/>
      <stop offset="1" stop-color="#0ea5a8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.08" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- large cap watermark -->
  <g transform="translate(830 120) scale(17)" fill="#fff" fill-opacity="0.08">
    <path d="M12 3 1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82Z"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(96 96)">
    <rect width="88" height="88" rx="20" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.35"/>
    <g transform="translate(14 13) scale(2.5)" fill="#fff">
      <path d="M12 3 1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82Z"/>
    </g>
  </g>
  <text x="208" y="134" font-family="Space Grotesk, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" letter-spacing="3">CS102 · PROGRAMMING II</text>
  <text x="208" y="168" font-family="Space Grotesk, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#e9f8ff" fill-opacity="0.85">Prince Sultan University</text>

  <!-- title -->
  <text font-family="Space Grotesk, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" fill="#fff" font-size="76">
    <tspan x="96" y="300">School Course</tspan>
    <tspan x="96" y="388">Enrolment System</tspan>
  </text>
  <rect x="96" y="414" width="120" height="8" rx="4" fill="#ff8a3d"/>
  <text x="96" y="470" font-family="Space Grotesk, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#e9f8ff">Enrollment, grading and administration in Java</text>

  <!-- role chips -->
  <g font-family="Space Grotesk, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#fff">
    <rect x="96" y="512" width="150" height="48" rx="24" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.4"/>
    <text x="171" y="543" text-anchor="middle">Student</text>
    <rect x="262" y="512" width="170" height="48" rx="24" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.4"/>
    <text x="347" y="543" text-anchor="middle">Instructor</text>
    <rect x="448" y="512" width="200" height="48" rx="24" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.4"/>
    <text x="548" y="543" text-anchor="middle">Administrator</text>
    <rect x="664" y="512" width="110" height="48" rx="24" fill="#ff8a3d"/>
    <text x="719" y="543" text-anchor="middle">Java</text>
  </g>

  <!-- code card -->
  <g transform="translate(860 380)">
    <rect width="340" height="180" rx="18" fill="#0f172a" fill-opacity="0.55" stroke="#fff" stroke-opacity="0.25"/>
    <circle cx="26" cy="26" r="6" fill="#ff8a3d"/>
    <circle cx="46" cy="26" r="6" fill="#fff" fill-opacity="0.5"/>
    <circle cx="66" cy="26" r="6" fill="#0ea5a8"/>
    <g font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="17">
      <text x="24" y="72" fill="#7dd3fc">class <tspan fill="#fff">Student</tspan></text>
      <text x="24" y="98" fill="#7dd3fc">  extends <tspan fill="#fff">User&lt;Student&gt;</tspan></text>
      <text x="24" y="132" fill="#fff">enroll_In_Course<tspan fill="#ffb27d">(course)</tspan>;</text>
      <text x="24" y="158" fill="#94a3b8">// credit limit checked</text>
    </g>
  </g>
</svg>
